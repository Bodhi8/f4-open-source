[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "vector1-f4-core"
version = "0.1.0"
description = "F4 Freight Finance Fraud Framework: synthetic portfolios, contracts and reference economics"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Vector1 Research LLC"}]
keywords = ["fraud detection", "freight factoring", "risk", "decision analysis", "synthetic data"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://vector1.ai"
Repository = "https://github.com/Bodhi8/f4-open-source"
Issues = "https://github.com/Bodhi8/f4-open-source/issues"
Changelog = "https://github.com/Bodhi8/f4-open-source/blob/main/CHANGELOG.md"

[project.optional-dependencies]
duckdb = ["duckdb>=1.1,<2"]
dev = ["build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
f4 = "f4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f4 = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
